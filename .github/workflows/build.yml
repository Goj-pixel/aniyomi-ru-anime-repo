name: Build Animelib Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Animelib Debug APK
        run: ./gradlew --no-daemon --stacktrace :src:ru:animelib:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: animelib-debug-apk
          path: src/ru/animelib/build/outputs/apk/debug/*.apk
